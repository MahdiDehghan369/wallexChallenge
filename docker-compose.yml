services:
  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: siavash:latest
    command: ["run", "--mode", "${MODE:-paper}"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VERSION_TAG: ${VERSION_TAG:-}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./config:/app/config
    healthcheck:
      # heartbeat file is written every 30 s by the engine (T-1102)
      test: ["CMD-SHELL", "test -n \"$$(find /app/state/heartbeat -mmin -3 2>/dev/null)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
