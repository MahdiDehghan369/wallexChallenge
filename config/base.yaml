# تنظیمات عمومی — ضمیمه I WALLEX_AGENT_PLAN.md
mode: paper                       # با env MODE بازنویسی می‌شود
timezone: Asia/Tehran             # فقط برای مرز «روز معاملاتی»
paths: {logs: logs, state: state, data: data, models: models, reports: reports}
loop:
  price_guard_s: 10
  main_loop_s: 60
  poll_seconds: 20
  book_poll_seconds: 15
  buffer_bars: 500
  reconcile_interval_min: 5
  equity_interval_s: 300
  watchdog_timeout_s: 180
  heartbeat_s: 30
  analyst_interval_min: 60
exchange:
  use_proxy: false
  rate_limit: {public_per_s: 5, public_burst: 10, private_per_s: 2, private_burst: 4}
  timeout_s: 10
  max_retries: 4
  backoff_min_s: 0.5
  backoff_max_s: 8
  ticker_cache_s: 5               # one markets call serves all tickers; cache it briefly
  # Swagger's markets endpoint has no spot min order -> conservative minimum order value per quote
  # (the undocumented /v1/markets showed minNotional 50000 for BTCTMN on 2026-10-22); confirm in T-108
  min_notional: {TMN: 100000, USDT: 5}
execution:
  entry_timeout_s: 90
  aggressive_timeout_s: 30
  max_slippage_pct: 0.15
  exit_max_slippage_pct: 0.3
  exit_max_attempts: 3
  order_poll_seconds: 5
  submit_lookup_attempts: 3
  submit_lookup_interval_s: 2
paper:
  fill_check_seconds: 5
  initial_balances: {TMN: 5000000}
bt:
  assumed_spread_pct: {default: 0.15, BTC/TMN: 0.05, ETH/TMN: 0.08, USDT/TMN: 0.03}
  extra_slippage_pct: 0.05
  warmup_days: 35                 # indicator warm-up (4h EMA200 needs ~33 days) before trading starts
  loop_overrides: {price_guard_s: 60, main_loop_s: 300, poll_seconds: 60, book_poll_seconds: 900, heartbeat_s: 3600}
  execution_overrides: {order_poll_seconds: 30}
llm:
  analyst: {enabled: true}
  reviewer: {enabled: true, allow_tools: false, timeout_s: 20}
  timeout_s: 20
  max_retries: 2
  max_tool_calls: 3
  tools_backend: auto             # auto | mcp | native
  use_proxy: false
  cache_mode: live                # live | replay | record_only
  fallback_size_multiplier: 0.5   # deterministic review when the LLM is unavailable
  fallback_ml_edge: 0.05          # fallback approves only if p_win >= threshold + edge
data:
  max_ffill_bars: 3               # gaps up to this many bars are forward-filled (is_filled=True, volume=0)
  outlier_jump_pct: 20            # |close/prev_close - 1| above this (15m) is flagged as outlier
alerts:
  backend: log_only              # log_only | webhook
  min_interval_s: 3
