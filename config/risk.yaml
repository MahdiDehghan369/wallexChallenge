# پارامترهای ریسک — ضمیمه B و بخش ۵ WALLEX_AGENT_PLAN.md
# هشدار: مقادیر سقف را بالاتر از بخش ۵ نبرید (فقط انسان، با CHANGELOG).
capital_base_tmn: 5000000
risk_per_trade_pct: 0.5
max_position_pct: 20
max_total_exposure_pct: 50
max_concurrent_positions: 3
max_positions_per_market: 1
daily_loss_limit_pct: 2.0
kill_switch_drawdown_pct: 5.0
cooldown_after_consecutive_losses: {losses: 2, minutes: 60}
cooldown_after_exit_minutes: 30
max_trades_per_hour: 4
max_trades_per_day: 25
max_spread_pct: 0.3
regime_multipliers: {TREND_UP: 1.0, RANGE: 0.7, HIGH_VOL: 0.5, PANIC: 0.0}
llm_size_multiplier_range: [0.25, 1.0]
initial_live_risk_scale: 0.5        # ضریب کلی در روز اول لایو
cash_buffer_fraction: 0.98          # حداکثر سهم نقد قابل استفاده در یک سفارش (T-701)
allowed_quotes: [TMN]               # فقط بازارهای تومانی معامله می‌شوند؛ USDT فقط منبع داده
allow_usdt_liquidation: true        # فقط SELL روی USDT/TMN (تبدیل USDT به تومان در endgame)
endgame:
  competition_end_utc: "2026-10-XXTHH:MM:00Z"          # "YYYY-MM-DDTHH:MM:00Z" — از برگزارکننده؛ بدون آن لایو شروع نمی‌شود
  no_new_entries_hours_before: 6
  start_unwind_hours_before: 3
  force_liquidate_hours_before: 1
  unwind_passive_timeout_s: 30      # UNWIND: سفارش فروش passive کوتاه، سپس تهاجمی
breakers:
  api_errors_window_min: 5
  api_errors_threshold: 5
  api_errors_clear_min: 15
  stale_data_seconds: 180
fees:
  maker_pct: 0.25     # عدد مرحله ۲ × ۱۰۰
  taker_pct: 0.25
